spring:
  application:
    name: order-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:7001/clothflow_order}
    username: ${SPRING_DATASOURCE_USERNAME:clothflow_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:floci-6201e1f5cf524b379ec1907e17e56d45}

    hikari:
      pool-name: OrderHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      validation-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:floci-msk-5f9b53:9092}

    consumer:
      group-id: clothflow-order-service
      auto-offset-reset: earliest
      enable-auto-commit: false

      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

    listener:
      ack-mode: manual


server:
  port: ${SERVER_PORT:8083}
  shutdown: graceful

clothflow:
  outbox:
    poll-interval-ms: ${CLOTHFLOW_OUTBOX_POLL_INTERVAL_MS:1000}
    retry-delay-seconds: ${CLOTHFLOW_OUTBOX_RETRY_DELAY_SECONDS:10}
    lease-seconds: ${CLOTHFLOW_OUTBOX_LEASE_SECONDS:60}


management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

  metrics:
    tags:
      application: clothflow-order-service


logging:
  level:
    org.springframework.kafka: DEBUG
    org.apache.kafka.clients.consumer: INFO

  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"


product:
  service:
    base-url: ${PRODUCT_SERVICE_BASE_URL:http://localhost:8080}


inventory:
  service:
    base-url: ${INVENTORY_SERVICE_BASE_URL:http://localhost:8082}


payment:
  service:
    base-url: ${PAYMENT_SERVICE_BASE_URL:http://localhost:8084}


resilience4j:

  circuitbreaker:

    instances:

      productService:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true

      inventoryService:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true

      paymentService:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true


  bulkhead:

    instances:

      productService:
        max-concurrent-calls: 20
        max-wait-duration: 0ms

      inventoryService:
        max-concurrent-calls: 20
        max-wait-duration: 0ms

      paymentService:
        max-concurrent-calls: 10
        max-wait-duration: 0ms


  retry:

    instances:

      productService:
        max-attempts: 3
        wait-duration: 500ms

        retry-exceptions:
          - com.clothflow.order.exception.ProductServiceException

services:
  user:
    base-url: ${USER_SERVICE_BASE_URL:http://localhost:8081}

service-auth:
  client-id: ${ORDER_SERVICE_CLIENT_ID:}
  client-secret: ${ORDER_SERVICE_CLIENT_SECRET:}