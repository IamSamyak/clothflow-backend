name: ClothFlow Docker Build, ECR Push and ECS Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  AWS_REGION: us-east-1

jobs:

  # ============================================================
  # Detect which application services changed
  # ============================================================
  detect-changes:
    name: Detect changed services
    runs-on: ubuntu-latest

    outputs:
      services: ${{ steps.services.outputs.services }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            product:
              - 'product-service/**'

            user:
              - 'user-service/**'

            inventory:
              - 'inventory-service/**'

            order:
              - 'order-service/**'

            payment:
              - 'payment-service/**'

            shipping:
              - 'shipping-service/**'

            notification:
              - 'notification-service/**'

            infrastructure:
              - 'infrastructure/**'

      - name: Build service matrix
        id: services
        shell: bash
        run: |
          services=()

          if [[ "${{ steps.filter.outputs.product }}" == "true" ]]; then
            services+=("product-service")
          fi

          if [[ "${{ steps.filter.outputs.user }}" == "true" ]]; then
            services+=("user-service")
          fi

          if [[ "${{ steps.filter.outputs.inventory }}" == "true" ]]; then
            services+=("inventory-service")
          fi

          if [[ "${{ steps.filter.outputs.order }}" == "true" ]]; then
            services+=("order-service")
          fi

          if [[ "${{ steps.filter.outputs.payment }}" == "true" ]]; then
            services+=("payment-service")
          fi

          if [[ "${{ steps.filter.outputs.shipping }}" == "true" ]]; then
            services+=("shipping-service")
          fi

          if [[ "${{ steps.filter.outputs.notification }}" == "true" ]]; then
            services+=("notification-service")
          fi

          if [[ ${#services[@]} -eq 0 ]]; then
            echo 'services=[]' >> "$GITHUB_OUTPUT"

            if [[ "${{ steps.filter.outputs.infrastructure }}" == "true" ]]; then
              echo "Infrastructure-only changes detected."
              echo "Docker/ECR/ECS deployment is not required."
            else
              echo "No application service changes detected."
            fi

            exit 0
          fi

          json=$(printf '%s\n' "${services[@]}" | jq -R . | jq -sc .)

          echo "services=$json" >> "$GITHUB_OUTPUT"

          echo "Changed application services:"
          echo "$json"


  # ============================================================
  # Build Docker images and publish them to ECR
  # ============================================================
  docker-ecr:
    name: Docker → ECR

    needs:
      - detect-changes

    if: needs.detect-changes.outputs.services != '[]'

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}

    permissions:
      contents: read
      id-token: write

    steps:

      # --------------------------------------------------------
      # Checkout repository
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Java 21
      # --------------------------------------------------------
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven


      # --------------------------------------------------------
      # Build Spring Boot application
      # --------------------------------------------------------
      - name: Build application
        working-directory: ${{ matrix.service }}
        run: |
          ./mvnw -B package -DskipTests


      # --------------------------------------------------------
      # Read Maven version
      # --------------------------------------------------------
      - name: Read service version
        id: version
        working-directory: ${{ matrix.service }}
        shell: bash
        run: |
          VERSION=$(./mvnw -q \
            -Dexpression=project.version \
            -DforceStdout \
            help:evaluate)

          echo "Service: ${{ matrix.service }}"
          echo "Version: $VERSION"

          if [[ "$VERSION" == *"-SNAPSHOT" ]]; then
            echo "::error::SNAPSHOT versions are not allowed for ECR releases."
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release version: $VERSION"
            echo "::error::Expected MAJOR.MINOR.PATCH"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"


      # --------------------------------------------------------
      # Authenticate GitHub → AWS using OIDC
      # --------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # --------------------------------------------------------
      # Verify AWS identity
      # --------------------------------------------------------
      - name: Resolve AWS account
        id: account
        shell: bash
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          echo "AWS account: $ACCOUNT_ID"

          echo "account_id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"


      # --------------------------------------------------------
      # Login to Amazon ECR
      # --------------------------------------------------------
      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2


      # --------------------------------------------------------
      # Resolve ECR repository
      # --------------------------------------------------------
      - name: Resolve ECR repository
        id: ecr
        shell: bash
        run: |
          REPOSITORY="clothflow/${{ matrix.service }}"

          echo "Repository: $REPOSITORY"

          aws ecr describe-repositories \
            --repository-names "$REPOSITORY" \
            --region "$AWS_REGION"

          echo "repository=$REPOSITORY" >> "$GITHUB_OUTPUT"


      # --------------------------------------------------------
      # Protect immutable release tags
      # --------------------------------------------------------
      - name: Verify release tag is unused
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPOSITORY: ${{ steps.ecr.outputs.repository }}
        run: |
          echo "Checking ECR tag:"
          echo "$REPOSITORY:$VERSION"

          if aws ecr describe-images \
            --repository-name "$REPOSITORY" \
            --image-ids imageTag="$VERSION" \
            --region "$AWS_REGION" \
            >/dev/null 2>&1; then

            echo "::error::ECR tag $VERSION already exists in $REPOSITORY."
            echo "::error::Immutable release policy prevents tag reuse."
            exit 1
          fi

          echo "ECR tag $VERSION is available."


      # --------------------------------------------------------
      # Build Docker image
      # --------------------------------------------------------
      - name: Build Docker image
        working-directory: ${{ matrix.service }}
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: ${{ steps.ecr.outputs.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          IMAGE="$REGISTRY/$REPOSITORY:$VERSION"

          echo "Building:"
          echo "$IMAGE"

          docker build \
            --tag "$IMAGE" \
            .


      # --------------------------------------------------------
      # Push Docker image
      # --------------------------------------------------------
      - name: Push Docker image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: ${{ steps.ecr.outputs.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          IMAGE="$REGISTRY/$REPOSITORY:$VERSION"

          echo "Pushing:"
          echo "$IMAGE"

          docker push "$IMAGE"


      # --------------------------------------------------------
      # Verify image exists in ECR
      # --------------------------------------------------------
      - name: Verify ECR image
        env:
          REPOSITORY: ${{ steps.ecr.outputs.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          aws ecr describe-images \
            --repository-name "$REPOSITORY" \
            --image-ids imageTag="$VERSION" \
            --region "$AWS_REGION" \
            --query 'imageDetails[0].{digest:imageDigest,tags:imageTags,pushed:imagePushedAt}' \
            --output table


  # ============================================================
  # Deploy successfully published images to ECS
  # ============================================================
  deploy-ecs:
    name: Deploy changed services to ECS

    needs:
      - detect-changes
      - docker-ecr

    if: >
      needs.detect-changes.outputs.services != '[]' &&
      needs.docker-ecr.result == 'success'

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: us-east-1
      ECS_CLUSTER: clothflow

    steps:

      # --------------------------------------------------------
      # Checkout repository
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Authenticate GitHub → AWS using OIDC
      # --------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # --------------------------------------------------------
      # Resolve ECS configuration
      # --------------------------------------------------------
      - name: Resolve ECS configuration
        id: config
        shell: bash
        run: |
          case "${{ matrix.service }}" in

            product-service)
              ECS_SERVICE="clothflow-product-service"
              TASK_FAMILY="clothflow-product-service"
              CONTAINER_NAME="product-service"
              ;;

            user-service)
              ECS_SERVICE="clothflow-user-service"
              TASK_FAMILY="clothflow-user-service"
              CONTAINER_NAME="user-service"
              ;;

            inventory-service)
              ECS_SERVICE="clothflow-inventory-service"
              TASK_FAMILY="clothflow-inventory-service"
              CONTAINER_NAME="inventory-service"
              ;;

            order-service)
              ECS_SERVICE="clothflow-order-service"
              TASK_FAMILY="clothflow-order-service"
              CONTAINER_NAME="order-service"
              ;;

            payment-service)
              ECS_SERVICE="clothflow-payment-service"
              TASK_FAMILY="clothflow-payment-service"
              CONTAINER_NAME="payment-service"
              ;;

            shipping-service)
              ECS_SERVICE="clothflow-shipping-service"
              TASK_FAMILY="clothflow-shipping-service"
              CONTAINER_NAME="shipping-service"
              ;;

            notification-service)
              ECS_SERVICE="clothflow-notification-service"
              TASK_FAMILY="clothflow-notification-service"
              CONTAINER_NAME="notification-service"
              ;;

            *)
              echo "::error::Unknown service: ${{ matrix.service }}"
              exit 1
              ;;
          esac

          echo "ECS service: $ECS_SERVICE"
          echo "Task family: $TASK_FAMILY"
          echo "Container: $CONTAINER_NAME"

          echo "ecs_service=$ECS_SERVICE" >> "$GITHUB_OUTPUT"
          echo "task_family=$TASK_FAMILY" >> "$GITHUB_OUTPUT"
          echo "container_name=$CONTAINER_NAME" >> "$GITHUB_OUTPUT"


      # --------------------------------------------------------
      # Read application version
      # --------------------------------------------------------
      - name: Read application version
        id: version
        working-directory: ${{ matrix.service }}
        shell: bash
        run: |
          VERSION=$(./mvnw -q \
            -Dexpression=project.version \
            -DforceStdout \
            help:evaluate)

          echo "Application version: $VERSION"

          if [[ "$VERSION" == *"-SNAPSHOT" ]]; then
            echo "::error::SNAPSHOT version cannot be deployed."
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release version: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"


      # --------------------------------------------------------
      # Resolve ECR image
      # --------------------------------------------------------
      - name: Resolve ECR image
        id: image
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          IMAGE="${REGISTRY}/clothflow/${{ matrix.service }}:${VERSION}"

          echo "Deployment image:"
          echo "$IMAGE"

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"


      # --------------------------------------------------------
      # Verify ECR image
      # --------------------------------------------------------
      - name: Verify ECR image
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPOSITORY: clothflow/${{ matrix.service }}
        run: |
          echo "Verifying:"
          echo "$REPOSITORY:$VERSION"

          aws ecr describe-images \
            --repository-name "$REPOSITORY" \
            --image-ids imageTag="$VERSION" \
            --region "$AWS_REGION" \
            --query 'imageDetails[0].{digest:imageDigest,tags:imageTags,pushed:imagePushedAt}' \
            --output table


      # --------------------------------------------------------
      # Download current ECS task definition
      # --------------------------------------------------------
      - name: Download current ECS task definition
        env:
          TASK_FAMILY: ${{ steps.config.outputs.task_family }}
        run: |
          aws ecs describe-task-definition \
            --task-definition "$TASK_FAMILY" \
            --region "$AWS_REGION" \
            --query taskDefinition \
            --output json > task-definition.json

          echo "Current task definition downloaded."


      # --------------------------------------------------------
      # Render new ECS task definition
      # --------------------------------------------------------
      - name: Render new task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ steps.config.outputs.container_name }}
          image: ${{ steps.image.outputs.image }}


      # --------------------------------------------------------
      # Deploy ECS service
      # --------------------------------------------------------
      - name: Deploy ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ steps.config.outputs.ecs_service }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true


      # --------------------------------------------------------
      # Deployment summary
      # --------------------------------------------------------
      - name: Deployment summary
        run: |
          echo "=========================================="
          echo "ECS deployment successful"
          echo "=========================================="
          echo "Service:  ${{ matrix.service }}"
          echo "Version:  ${{ steps.version.outputs.version }}"
          echo "ECS:      ${{ steps.config.outputs.ecs_service }}"
          echo "Task:     ${{ steps.config.outputs.task_family }}"
          echo "=========================================="
