spring:
  application:
    name: inventory-service

  datasource:
    url: jdbc:postgresql://localhost:7001/clothflow
    username: clothflow_admin
    password: clothflow_password
    driver-class-name: org.postgresql.Driver

    hikari:
      pool-name: InventoryHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      validation-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:9092

server:
  port: 8082

clothflow:
  kafka:
    topics:
      inventory-events: inventory-events

  outbox:
    publisher:
      enabled: true
      fixed-delay-ms: 5000
      recovery-delay-ms: 30000

    retry:
      base-delay-seconds: 5
      max-delay-seconds: 300
      max-attempts: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info