spring:
  application:
    name: shipping-service

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
          issuer-uri: ${JWT_ISSUER:clothflow-user-service}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:7001/clothflow_shipping}
    username: ${SPRING_DATASOURCE_USERNAME:clothflow_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:floci-6201e1f5cf524b379ec1907e17e56d45}
    driver-class-name: org.postgresql.Driver

    hikari:
      pool-name: ShippingHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      validation-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    consumer:
      group-id: ${SPRING_KAFKA_CONSUMER_GROUP_ID:clothflow-shipping-service}
      enable-auto-commit: false
      auto-offset-reset: earliest

      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

    listener:
      ack-mode: manual

  lifecycle:
    timeout-per-shutdown-phase: 30s


server:
  port: ${SERVER_PORT:8085}
  shutdown: graceful


management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true


info:
  app:
    name: ${spring.application.name}
    description: ClothFlow Shipping Service
    version: ${APP_VERSION:0.0.1}


logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"


shipping:
  webhook:
    secret: ${SHIPPING_WEBHOOK_SECRET}


resilience4j:

  circuitbreaker:

    instances:

      shippingCreate:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true

      shippingTracking:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true


  retry:

    instances:

      shippingCreate:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2

      shippingTracking:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2


  bulkhead:

    instances:

      shippingCreate:
        max-concurrent-calls: 10
        max-wait-duration: 0ms

      shippingTracking:
        max-concurrent-calls: 20
        max-wait-duration: 0ms


  timelimiter:

    instances:

      shippingCreate:
        timeout-duration: 5s
        cancel-running-future: true

      shippingTracking:
        timeout-duration: 3s
        cancel-running-future: true

jwt:
  audience: ${JWT_AUDIENCE:clothflow-api}
  internal-audience: ${JWT_INTERNAL_AUDIENCE:clothflow-internal}