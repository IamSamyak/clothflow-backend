spring:
  application:
    name: payment-service

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_JWK_SET_URI:http://floci:8081/.well-known/jwks.json}
          issuer-uri: ${JWT_ISSUER:clothflow-user-service}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:7001/clothflow_payment}
    username: ${SPRING_DATASOURCE_USERNAME:clothflow_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:floci-6201e1f5cf524b379ec1907e17e56d45}

    hikari:
      pool-name: OrderHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      validation-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

      # Wait for broker acknowledgement
      acks: all

      # Enable Kafka producer idempotence
      enable-idempotence: true

      # Retry transient broker/network failures
      retries: 10

      properties:
        delivery.timeout.ms: 120000
        request.timeout.ms: 30000

server:
  port: ${SERVER_PORT:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

  metrics:
    tags:
      application: clothflow-payment-service

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"